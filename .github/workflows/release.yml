name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'windows-tauri'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Windows Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Global Quick Capture ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 Novidades desta versão:
            - Captura rápida com atalho global (Win + Alt + S).
            - Overlay translúcido com mira em cruz.
            - Card estilo Warp com evidências de QA e atalhos de projetos.
            - Onboarding automático para conectar o cofre do Obsidian.
            - Gravação direta e append limpo em Markdown.
          releaseDraft: false
          prerelease: false

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
