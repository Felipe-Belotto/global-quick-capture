[package]
name = "global-quick-capture"
version = "0.1.4"
description = "Global Quick Capture for Windows & Obsidian"
authors = ["Felipe"]
edition = "2021"

[lib]
name = "global_quick_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
rfd = "0.17.2"
xcap = "0.9.8"
arboard = "3"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
